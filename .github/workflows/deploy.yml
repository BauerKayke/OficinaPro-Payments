name: Deploy Payment API

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      instance_ip:
        description: 'IP da instância EC2 (Opcional)'
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: image_name
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image_name.outputs.name }}:${{ github.sha }},${{ steps.image_name.outputs.name }}:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Find EC2 Instance IP
        id: find_ip
        run: |
          # Prioridade 1: IP do input manual
          if [ -n "${{ github.event.inputs.instance_ip }}" ]; then
            echo "instance_ip=${{ github.event.inputs.instance_ip }}" >> $GITHUB_OUTPUT
            echo "✅ Usando IP fornecido manualmente: ${{ github.event.inputs.instance_ip }}"
          # Prioridade 2: AWS Parameter Store (mais rápido e confiável)
          else
            echo "🔍 Buscando IP no AWS Parameter Store..."
            IP=$(aws ssm get-parameter \
              --name "/oficinapro/k3s/ec2-public-ip" \
              --query "Parameter.Value" \
              --output text 2>/dev/null || echo "")

            # Fallback 3: Buscar via EC2 describe-instances
            if [ -z "$IP" ]; then
              echo "⚠️  Parameter Store não encontrado, buscando via AWS CLI..."
              IP=$(aws ec2 describe-instances \
                --filters "Name=tag:Name,Values=*k3s-node*" \
                          "Name=instance-state-name,Values=running" \
                --query "Reservations[*].Instances[*].PublicIpAddress" \
                --output text)
            fi

            if [ -z "$IP" ]; then
              echo "::error::Não foi possível encontrar o IP da instância EC2"
              exit 1
            fi
            echo "instance_ip=$IP" >> $GITHUB_OUTPUT
            echo "✅ IP encontrado: $IP"
          fi

      - name: Debug SSH Key (Check format)
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::A Secret SSH_PRIVATE_KEY está VAZIA!"
            exit 1
          else
            echo "A Secret SSH_PRIVATE_KEY foi encontrada."
            echo "Comprimento da chave: ${#SSH_KEY} caracteres."
            echo "Primeira linha (verificar header): $(echo "$SSH_KEY" | head -n 1)"
            if [[ "$SSH_KEY" != *"-----BEGIN"* ]]; then
               echo "::error::A chave não começa com -----BEGIN. Verifique a cópia!"
               exit 1
            fi
          fi
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to K3s
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.find_ip.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Atualizar repo (opcional, pois vamos mandar o yaml via cat ou git pull)
            # Vamos aplicar o yaml direto

            IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')

            # Criar arquivo de deployment temporário com a imagem correta
            cat <<EOF > payment-deploy.yaml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: payment-api
              namespace: oficinapro-dev
              labels:
                app: payment-api
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: payment-api
              template:
                metadata:
                  labels:
                    app: payment-api
                spec:
                  imagePullSecrets:
                  - name: ghcr-secret
                  containers:
                  - name: payment-api
                    image: $IMAGE_NAME
                    imagePullPolicy: Always
                    ports:
                    - containerPort: 8000
                    env:
                    - name: MP_ACCESS_TOKEN
                      value: "${{ secrets.MP_TOKEN }}"
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: payment-service
              namespace: oficinapro-dev
            spec:
              selector:
                app: payment-api
              ports:
                - protocol: TCP
                  port: 8080
                  targetPort: 8000
            ---
            apiVersion: networking.k8s.io/v1
            kind: Ingress
            metadata:
              name: payment-ingress
              namespace: oficinapro-dev
              annotations:
                nginx.ingress.kubernetes.io/rewrite-target: /api/v1/$2
            spec:
              ingressClassName: nginx
              rules:
              - http:
                  paths:
                  - path: /pagamento(/|$)(.*)
                    pathType: Prefix
                    backend:
                      service:
                        name: payment-service
                        port:
                          number: 8080
            EOF

            export KUBECONFIG=~/.kube/config
            /usr/local/bin/k3s kubectl apply -f payment-deploy.yaml
            /usr/local/bin/k3s kubectl rollout status deployment/payment-api -n oficinapro-dev --timeout=2m

