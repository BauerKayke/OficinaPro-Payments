name: Deploy Payment API

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      instance_ip:
        description: 'IP da instância EC2 (Opcional)'
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        id: image_name
        run: echo "name=$(echo ghcr.io/${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image_name.outputs.name }}:${{ github.sha }},${{ steps.image_name.outputs.name }}:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Find EC2 Instance IP
        id: find_ip
        run: |
          if [ -n "${{ github.event.inputs.instance_ip }}" ]; then
            echo "instance_ip=${{ github.event.inputs.instance_ip }}" >> $GITHUB_OUTPUT
          else
            IP=$(aws ssm get-parameter --name "/oficinapro/k3s/ec2-public-ip" --query "Parameter.Value" --output text 2>/dev/null || echo "")
            if [ -z "$IP" ]; then
              IP=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=*k3s-node*" "Name=instance-state-name,Values=running" --query "Reservations[*].Instances[*].PublicIpAddress" --output text)
            fi
            if [ -z "$IP" ]; then
              echo "::error::Não foi possível encontrar o IP da instância EC2"
              exit 1
            fi
            echo "instance_ip=$IP" >> $GITHUB_OUTPUT
          fi

      - name: Debug SSH Key
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_PRIVATE_KEY vazia!"
            exit 1
          fi

      - name: Deploy to K3s
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.find_ip.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
            
            # Variáveis
            export MP_TOKEN="${{ secrets.MP_TOKEN }}"
            export NR_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}"

            cat <<EOF > payment-deploy.yaml
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: payment-api
              namespace: oficinapro-dev
              labels:
                app: payment-api
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: payment-api
              template:
                metadata:
                  labels:
                    app: payment-api
                spec:
                  imagePullSecrets:
                  - name: ghcr-secret
                  containers:
                  - name: payment-api
                    image: $IMAGE_NAME
                    imagePullPolicy: Always
                    ports:
                    - containerPort: 8000
                    env:
                    - name: MP_ACCESS_TOKEN
                      value: "$MP_TOKEN"
                    - name: NEW_RELIC_LICENSE_KEY
                      value: "$NR_KEY"
                    - name: ENVIRONMENT
                      value: "production"
                    - name: LOG_LEVEL
                      value: "INFO"
                    - name: TELEMETRY_ENABLED
                      value: "true"
                    - name: OTEL_SERVICE_NAME
                      value: "oficinapro-payments"
                    - name: OTEL_EXPORTER_OTLP_ENDPOINT
                      value: "https://otlp.nr-data.net"
                    resources:
                      requests:
                        memory: "128Mi"
                        cpu: "100m"
                      limits:
                        memory: "256Mi"
                        cpu: "500m"
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 8000
                      initialDelaySeconds: 15
                      periodSeconds: 20
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 8000
                      initialDelaySeconds: 5
                      periodSeconds: 10
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: payment-service
              namespace: oficinapro-dev
            spec:
              selector:
                app: payment-api
              ports:
                - protocol: TCP
                  port: 8080
                  targetPort: 8000
            EOF

            export KUBECONFIG=~/.kube/config
            
            echo "📦 Aplicando manifesto..."
            /usr/local/bin/k3s kubectl apply -f payment-deploy.yaml
            
            echo "⏳ Aguardando rollout..."
            /usr/local/bin/k3s kubectl rollout status deployment/payment-api -n oficinapro-dev --timeout=2m || true

      - name: Diagnóstico Pós-Deploy
        if: always()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.find_ip.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export KUBECONFIG=~/.kube/config
            echo "=== PODS ==="
            /usr/local/bin/k3s kubectl get pods -n oficinapro-dev -l app=payment-api -o wide
            
            POD_NAME=$(/usr/local/bin/k3s kubectl get pods -n oficinapro-dev -l app=payment-api -o jsonpath="{.items[0].metadata.name}")
            
            if [ -n "$POD_NAME" ]; then
              echo "=== DESCRIBE POD: $POD_NAME ==="
              /usr/local/bin/k3s kubectl describe pod $POD_NAME -n oficinapro-dev
              
              echo "=== LOGS (Últimas 50 linhas) ==="
              /usr/local/bin/k3s kubectl logs $POD_NAME -n oficinapro-dev --tail=50
              
              echo "=== TESTE DE SAÚDE INTERNO ==="
              POD_IP=$(/usr/local/bin/k3s kubectl get pod $POD_NAME -n oficinapro-dev -o jsonpath='{.status.podIP}')
              curl -v http://$POD_IP:8000/health || echo "Falha no curl interno"
            else
              echo "❌ Nenhum pod encontrado para payment-api"
            fi
