name: 'CI/CD - Payment Service Deploy'

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/deploy-payment-service.yml'
  workflow_dispatch:
    inputs:
      instance_ip:
        description: 'IP da instância EC2 (Opcional - Busca automático se vazio)'
        required: false
        type: string

env:
  IMAGE_NAME: payment-service
  K8S_NAMESPACE: oficinapro-dev

jobs:
  build-and-push:
    name: 'Build e Publicação da Imagem Docker'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.image_info.outputs.full_image }}

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Login no GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Converter nome da imagem para minúsculas'
        id: image_info
        run: |
          REPO_NAME=$(echo ghcr.io/${{ github.repository }}/payment-service | tr '[:upper:]' '[:lower:]')
          FULL_IMAGE="${REPO_NAME}:${{ github.sha }}"
          echo "repo_name=${REPO_NAME}" >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "### 🏷️ Image Info" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** \`${REPO_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: 'Build e push da imagem Docker'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image_info.outputs.full_image }}
            ${{ steps.image_info.outputs.repo_name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 'Testar imagem localmente'
        run: |
          echo "### 🧪 Testando imagem" >> $GITHUB_STEP_SUMMARY
          echo "Iniciando teste de sanidade da imagem Docker..." >> $GITHUB_STEP_SUMMARY

          # Rodar container temporário (porta 8000 → 8080)
          echo "🐳 Iniciando container..."
          CONTAINER_ID=$(docker run -d \
            -p 8080:8000 \
            -e MP_ACCESS_TOKEN="TEST-TOKEN" \
            ${{ steps.image_info.outputs.full_image }})

          echo "Container ID: ${CONTAINER_ID}"
          echo "**Container ID:** \`${CONTAINER_ID}\`" >> $GITHUB_STEP_SUMMARY

          # Aguardar startup
          echo "⏳ Aguardando aplicação iniciar (20s)..."
          sleep 20

          # Mostrar logs iniciais
          echo ""
          echo "📋 Logs iniciais do container:"
          docker logs ${CONTAINER_ID} 2>&1 | tail -n 20

          # Testar health check
          echo ""
          echo "🏥 Testando health check..."
          for i in {1..10}; do
            echo "Tentativa $i/10..."
            if curl -f -v http://localhost:8080/health 2>&1; then
              echo "✅ Health check passou!" >> $GITHUB_STEP_SUMMARY
              echo "✅ Imagem validada com sucesso!" >> $GITHUB_STEP_SUMMARY
              docker stop ${CONTAINER_ID}
              exit 0
            fi
            echo "❌ Tentativa $i falhou, aguardando 3s..."
            sleep 3
          done

          echo "❌ Health check falhou após 10 tentativas!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Logs completos do container:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker logs ${CONTAINER_ID} 2>&1 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "=== LOGS COMPLETOS DO CONTAINER ==="
          docker logs ${CONTAINER_ID} 2>&1

          docker stop ${CONTAINER_ID}
          exit 1

  deploy-payment-service:
    name: 'Deploy no Kubernetes'
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Configurar credenciais AWS'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 'Buscar IP da instância EC2'
        id: find_ip
        run: |
          if [ -n "${{ github.event.inputs.instance_ip }}" ]; then
            echo "Usando IP fornecido manualmente..."
            echo "instance_ip=${{ github.event.inputs.instance_ip }}" >> $GITHUB_OUTPUT
          else
            echo "🔍 Buscando IP no AWS Parameter Store..."
            IP=$(aws ssm get-parameter \
              --name "/oficinapro/k3s/ec2-public-ip" \
              --query "Parameter.Value" \
              --output text 2>/dev/null || echo "")

            if [ -z "$IP" ]; then
              echo "⚠️ Parameter Store não encontrado, buscando via EC2..."
              IP=$(aws ec2 describe-instances \
                --filters "Name=tag:Name,Values=*k3s-node*" "Name=instance-state-name,Values=running" \
                --query "Reservations[*].Instances[*].PublicIpAddress" \
                --output text)
            fi

            if [ -z "$IP" ] || [ "$IP" == "None" ]; then
              echo "::error::Não foi possível encontrar instância EC2 rodando."
              exit 1
            fi

            echo "Instância encontrada: $IP"
            echo "instance_ip=$IP" >> $GITHUB_OUTPUT
          fi

      - name: 'Verificar estado da instância EC2'
        id: verify_instance
        run: |
          IP="${{ steps.find_ip.outputs.instance_ip }}"
          echo "🔍 Verificando estado da instância: $IP"

          # Buscar Instance ID pelo IP
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=$IP" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "::error::❌ Instância com IP $IP não está RUNNING!"
            echo "💡 Dica: Execute o workflow 'App Infra CI/CD' para provisionar/iniciar a infra"
            exit 1
          fi

          echo "✅ Instância $INSTANCE_ID está RUNNING"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

          # Verificar conectividade SSH (retry até 3x)
          echo "🔌 Testando conectividade SSH..."
          for i in {1..3}; do
            if timeout 10 bash -c "cat < /dev/null > /dev/tcp/$IP/22"; then
              echo "✅ Porta SSH (22) acessível!"
              exit 0
            fi
            echo "⚠️ Tentativa $i/3 falhou, aguardando 10s..."
            sleep 10
          done

          echo "::error::❌ Porta SSH não está acessível após 3 tentativas!"
          echo "💡 Possíveis causas:"
          echo "   - Security Group bloqueando SSH"
          echo "   - Instância ainda inicializando"
          echo "   - Firewall local bloqueando conexões"
          exit 1

      - name: 'Deploy do Payment Service no Kubernetes'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.find_ip.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          script: |
            # Configurar Kubeconfig
            mkdir -p ~/.kube
            sudo cp /etc/rancher/k3s/k3s.yaml ~/.kube/config
            sudo chown ubuntu:ubuntu ~/.kube/config
            export KUBECONFIG=~/.kube/config

            # Definir variáveis
            IMAGE_NAME=$(echo ghcr.io/${{ github.repository }}/payment-service | tr '[:upper:]' '[:lower:]')
            FULL_IMAGE="${IMAGE_NAME}:${{ github.sha }}"

            echo "=== Deploy Payment Service ==="
            echo "Imagem: ${FULL_IMAGE}"
            echo "Namespace: ${{ env.K8S_NAMESPACE }}"

            # Criar namespace se não existir
            echo "🔧 Criando namespace..."
            /usr/local/bin/k3s kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
            echo "✅ Namespace configurado"

            # Criar/atualizar Secret do GHCR (mesmo padrão do Core Service)
            echo "🔐 Criando secret do GHCR..."
            /usr/local/bin/k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GHCR_PAT }} \
              --docker-email=ci@oficinapro.com \
              -n ${{ env.K8S_NAMESPACE }} \
              --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
            echo "✅ Secret GHCR configurado"

            # Criar/atualizar Secret do Mercado Pago
            echo "🔐 Criando secret do Mercado Pago..."
            /usr/local/bin/k3s kubectl create secret generic payment-service-secrets \
              --from-literal=MP_ACCESS_TOKEN="${{ secrets.MP_TOKEN }}" \
              -n ${{ env.K8S_NAMESPACE }} \
              --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -
            echo "✅ Secret Mercado Pago configurado"

            # Criar manifests temporários (mesmo padrão inline do Core Service)
            cat > /tmp/payment-deployment.yaml << 'MANIFEST_EOF'
            ---
            apiVersion: v1
            kind: ConfigMap
            metadata:
              name: payment-service-config
              namespace: ${{ env.K8S_NAMESPACE }}
              labels:
                app: payment-service
            data:
              OTEL_SERVICE_NAME: "payment-service"
              LOG_LEVEL: "INFO"
              ENVIRONMENT: "production"
            ---
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: payment-service
              namespace: ${{ env.K8S_NAMESPACE }}
              labels:
                app: payment-service
                version: v1
            spec:
              replicas: 2
              strategy:
                type: RollingUpdate
                rollingUpdate:
                  maxSurge: 1
                  maxUnavailable: 0
              selector:
                matchLabels:
                  app: payment-service
              template:
                metadata:
                  labels:
                    app: payment-service
                    version: v1
                spec:
                  imagePullSecrets:
                  - name: ghcr-secret
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                    fsGroup: 1000
                  containers:
                  - name: payment-service
                    image: PLACEHOLDER_IMAGE
                    imagePullPolicy: Always
                    ports:
                    - containerPort: 8000
                      name: http
                      protocol: TCP
                    env:
                    - name: MP_ACCESS_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: payment-service-secrets
                          key: MP_ACCESS_TOKEN
                    - name: PORT
                      value: "8000"
                    envFrom:
                    - configMapRef:
                        name: payment-service-config
                    resources:
                      requests:
                        memory: "256Mi"
                        cpu: "100m"
                      limits:
                        memory: "512Mi"
                        cpu: "500m"
                    livenessProbe:
                      httpGet:
                        path: /health
                        port: 8000
                        scheme: HTTP
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      successThreshold: 1
                      failureThreshold: 3
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: 8000
                        scheme: HTTP
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      timeoutSeconds: 3
                      successThreshold: 1
                      failureThreshold: 3
                    startupProbe:
                      httpGet:
                        path: /health
                        port: 8000
                        scheme: HTTP
                      initialDelaySeconds: 0
                      periodSeconds: 10
                      timeoutSeconds: 3
                      successThreshold: 1
                      failureThreshold: 30
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      runAsNonRoot: true
                      runAsUser: 1000
                      capabilities:
                        drop:
                        - ALL
            ---
            apiVersion: v1
            kind: Service
            metadata:
              name: payment-service
              namespace: ${{ env.K8S_NAMESPACE }}
              labels:
                app: payment-service
            spec:
              type: ClusterIP
              sessionAffinity: ClientIP
              sessionAffinityConfig:
                clientIP:
                  timeoutSeconds: 10800
              ports:
              - port: 8080
                targetPort: 8000
                protocol: TCP
                name: http
              selector:
                app: payment-service
            ---
            apiVersion: autoscaling/v2
            kind: HorizontalPodAutoscaler
            metadata:
              name: payment-service-hpa
              namespace: ${{ env.K8S_NAMESPACE }}
              labels:
                app: payment-service
            spec:
              scaleTargetRef:
                apiVersion: apps/v1
                kind: Deployment
                name: payment-service
              minReplicas: 2
              maxReplicas: 5
              metrics:
              - type: Resource
                resource:
                  name: cpu
                  target:
                    type: Utilization
                    averageUtilization: 70
              - type: Resource
                resource:
                  name: memory
                  target:
                    type: Utilization
                    averageUtilization: 80
              behavior:
                scaleDown:
                  stabilizationWindowSeconds: 300
                  policies:
                  - type: Percent
                    value: 50
                    periodSeconds: 60
                scaleUp:
                  stabilizationWindowSeconds: 0
                  policies:
                  - type: Percent
                    value: 100
                    periodSeconds: 15
            MANIFEST_EOF

            # Substituir placeholder pela imagem real
            sed -i "s|PLACEHOLDER_IMAGE|${FULL_IMAGE}|g" /tmp/payment-deployment.yaml

            # Aplicar manifests
            echo "📦 Aplicando manifests Kubernetes..."
            /usr/local/bin/k3s kubectl apply -f /tmp/payment-deployment.yaml
            echo "✅ Manifests aplicados"

            # Aguardar rollout
            echo ""
            echo "⏳ Aguardando rollout do deployment..."
            echo "Isso pode levar até 5 minutos..."
            if /usr/local/bin/k3s kubectl rollout status deployment/payment-service \
              -n ${{ env.K8S_NAMESPACE }} \
              --timeout=5m; then
              echo "✅ Deploy concluído com sucesso!"
            else
              echo "❌ Rollout falhou ou deu timeout!"
              echo ""
              echo "==============================================="
              echo "=== 🔍 DIAGNÓSTICO DO ERRO ==="
              echo "==============================================="

              echo ""
              echo "--- STATUS DOS PODS ---"
              /usr/local/bin/k3s kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=payment-service -o wide

              echo ""
              echo "--- DESCRIBE DOS PODS (detalhes completos) ---"
              /usr/local/bin/k3s kubectl describe pods -n ${{ env.K8S_NAMESPACE }} -l app=payment-service

              echo ""
              echo "--- EVENTOS RECENTES (últimos 50) ---"
              /usr/local/bin/k3s kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | tail -n 50

              echo ""
              echo "--- LOGS DOS PODS (últimas 100 linhas) ---"
              for pod in $(/usr/local/bin/k3s kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=payment-service -o jsonpath='{.items[*].metadata.name}'); do
                echo "=== Logs do Pod: $pod ==="
                /usr/local/bin/k3s kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --tail=100 || echo "Sem logs disponíveis"
                echo ""
                echo "=== Logs Anteriores (se pod reiniciou) ==="
                /usr/local/bin/k3s kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --previous --tail=50 2>/dev/null || echo "Pod não reiniciou"
                echo ""
              done

              echo ""
              echo "--- DEPLOYMENT STATUS ---"
              /usr/local/bin/k3s kubectl get deployment payment-service -n ${{ env.K8S_NAMESPACE }} -o yaml | grep -A 20 "status:"

              echo ""
              echo "==============================================="
              exit 1
            fi

      - name: 'Verificar deployment'
        if: always()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.find_ip.outputs.instance_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export KUBECONFIG=~/.kube/config

            echo "==============================================="
            echo "=== 📊 RELATÓRIO COMPLETO DO DEPLOYMENT ==="
            echo "==============================================="
            echo ""

            echo "--- 1. STATUS DOS PODS ---"
            /usr/local/bin/k3s kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=payment-service -o wide
            echo ""

            echo "--- 2. DEPLOYMENT STATUS ---"
            /usr/local/bin/k3s kubectl get deployment payment-service -n ${{ env.K8S_NAMESPACE }}
            echo ""

            echo "--- 3. SERVICE ---"
            /usr/local/bin/k3s kubectl get svc -n ${{ env.K8S_NAMESPACE }} payment-service
            echo ""

            echo "--- 4. HPA (Auto-scaling) ---"
            /usr/local/bin/k3s kubectl get hpa -n ${{ env.K8S_NAMESPACE }} payment-service-hpa
            echo ""

            echo "--- 5. DESCRIBE DOS PODS (Status Detalhado) ---"
            /usr/local/bin/k3s kubectl describe pods -n ${{ env.K8S_NAMESPACE }} -l app=payment-service | grep -A 5 "Conditions:\|Events:"
            echo ""

            echo "--- 6. EVENTOS RECENTES (últimos 30) ---"
            /usr/local/bin/k3s kubectl get events -n ${{ env.K8S_NAMESPACE }} --sort-by='.lastTimestamp' | tail -n 30
            echo ""

            echo "--- 7. LOGS DOS CONTAINERS (últimas 50 linhas) ---"
            for pod in $(/usr/local/bin/k3s kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=payment-service -o jsonpath='{.items[*].metadata.name}'); do
              echo "=== Pod: $pod ==="
              /usr/local/bin/k3s kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --tail=50 || echo "⚠️  Sem logs disponíveis"
              echo ""
            done

            echo "--- 8. HEALTH CHECK INTERNO (via curl pod) ---"
            /usr/local/bin/k3s kubectl run test-health-${{ github.run_number }} \
              --image=curlimages/curl \
              --restart=Never \
              --rm \
              -i \
              -n ${{ env.K8S_NAMESPACE }} \
              -- curl -v http://payment-service.${{ env.K8S_NAMESPACE }}.svc.cluster.local:8080/health 2>&1 || echo "⚠️  Health check falhou"
            echo ""

            echo "--- 9. CONFIGURAÇÕES DO DEPLOYMENT ---"
            /usr/local/bin/k3s kubectl get deployment payment-service -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.spec.template.spec.containers[0]}' | jq '.'
            echo ""

            echo "==============================================="
            echo "=== ✅ RELATÓRIO COMPLETO ==="
            echo "==============================================="

  notify:
    name: 'Notificação de Deploy'
    needs: [build-and-push, deploy-payment-service]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 'Resumo do deploy'
        run: |
          echo "## 🚀 Payment Service Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Autor:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status Build:** ${{ needs.build-and-push.result == 'success' && '✅ Sucesso' || '❌ Falhou' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status Deploy:** ${{ needs.deploy-payment-service.result == 'success' && '✅ Sucesso' || '❌ Falhou' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.deploy-payment-service.result }}" == "success" ]]; then
            echo "### ✅ Deploy concluído com sucesso!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **DNS Interno:** \`payment-service.oficinapro-dev.svc.cluster.local:8080\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "📝 **Próximos passos:**" >> $GITHUB_STEP_SUMMARY
            echo "- Verificar logs: \`kubectl logs -f -n oficinapro-dev -l app=payment-service\`" >> $GITHUB_STEP_SUMMARY
            echo "- Testar health: \`curl http://payment-service.oficinapro-dev.svc.cluster.local:8080/health\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deploy falhou" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Verifique os logs do job 'Deploy no Kubernetes' para mais detalhes." >> $GITHUB_STEP_SUMMARY
          fi
