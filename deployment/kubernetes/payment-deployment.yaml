apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: oficinapro-dev
  labels:
    app: payment-api
    app.kubernetes.io/name: payment-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: oficinapro
  annotations:
    kubernetes.io/change-cause: "OpenTelemetry observability enabled"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
        app.kubernetes.io/name: payment-api
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: payment-api
        image: ghcr.io/bauerkayke/oficinapro-payments:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        # Mercado Pago
        - name: MP_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: oficinapro-secrets
              key: MP_TOKEN

        # Application Config
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "INFO"
        - name: SERVICE_VERSION
          value: "1.0.0"

        # --- OpenTelemetry / New Relic Configuration ---
        - name: TELEMETRY_ENABLED
          value: "true"
        - name: OTEL_SERVICE_NAME
          value: "oficinapro-payments"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "https://otlp.nr-data.net"
        - name: NEW_RELIC_LICENSE_KEY
          valueFrom:
            secretKeyRef:
              name: oficinapro-secrets
              key: NEW_RELIC_LICENSE_KEY
              optional: false
        # -----------------------------------------------

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: oficinapro-dev
spec:
  selector:
    app: payment-api
  ports:
    - protocol: TCP
      port: 8080 # Porta interna do cluster
      targetPort: 8000 # Porta do container Python

